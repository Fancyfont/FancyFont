<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script>
var path = window.location.pathname;
var repo = "/FancyFont";
var redirect =
  repo + "/?redirect=" +
  encodeURIComponent(path.replace(repo, "") + window.location.search + window.location.hash);

window.location.replace(redirect);
</script>
</head>
<body></body>
</html>
